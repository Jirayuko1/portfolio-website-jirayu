<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e241c"/>
      <stop offset="100%" stop-color="#120e0b"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe191"/>
      <stop offset="50%" stop-color="#e2b55f"/>
      <stop offset="100%" stop-color="#996f26"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="55%" stop-color="#f0c770"/>
      <stop offset="100%" stop-color="#ba8729"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer Luxury Gold Rim -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="url(#goldBorder)" stroke-width="12"/>

  <!-- Inner Subtle Accent Ring -->
  <rect x="28" y="28" width="456" height="456" rx="98" fill="none" stroke="#e2b55f" stroke-width="2.5" stroke-opacity="0.45"/>

  <!-- Monogram JK -->
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="central"
        font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="200"
        fill="url(#goldText)" filter="url(#shadow)" letter-spacing="4">JK</text>

  <!-- Elegant 4-point Sparkle Star -->
  <path d="M256,378 L261,391 L274,396 L261,401 L256,414 L251,401 L238,396 L251,391 Z" fill="#ffe191" opacity="0.95"/>
</svg>
